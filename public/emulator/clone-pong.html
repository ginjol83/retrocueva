<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clone Pong Emulator</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }

      #game-wrapper {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="game"></div>
    </div>
    <script>
      EJS_player = "#game";
      EJS_core = "gambatte";
      EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      EJS_gameUrl = "/roms/Clon_Pong.gb?v=2";
      EJS_language = "en-US";
      EJS_disableLocalStorage = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
  </body>
</html>
